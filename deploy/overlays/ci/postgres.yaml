# Postgres descartável do e2e: dados em emptyDir, sem senha, só dentro do namespace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grocery-ops-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # usuário `postgres` da imagem alpine
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:18.1-alpine@sha256:aa6eb304ddb6dd26df23d05db4e5cb05af8951cda3e0dc57731b771e0ef4ab29
          # Sem o docker-entrypoint.sh: no k3s do runner o servidor travava no primeiro I/O
          # depois de subir (no startup e no psql do entrypoint). Aqui o initdb roda direto,
          # sem fsync, com I/O síncrono (io_method=sync, novo no 18) e sem huge pages.
          # Banco descartável, só para o e2e: superusuário `app`, sem senha, banco `postgres`.
          command: [sh, -c]
          args:
            - |
              set -eu
              if [ ! -s "$PGDATA/PG_VERSION" ]; then
                mkdir -p "$PGDATA"
                initdb --username=app --auth=trust --no-sync --no-instructions
                echo "host all all all trust" >> "$PGDATA/pg_hba.conf"
              fi
              exec postgres -c listen_addresses='*' -c fsync=off -c synchronous_commit=off \
                -c full_page_writes=off -c shared_buffers=32MB -c io_method=sync -c huge_pages=off
          ports:
            - name: postgres
              containerPort: 5432
          # Só libera liveness/readiness depois de pronto, com até 5 min para o initdb.
          startupProbe:
            exec:
              command: [pg_isready, -U, app, -d, postgres, -h, 127.0.0.1]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [pg_isready, -U, app, -d, postgres, -h, 127.0.0.1]
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, app, -d, postgres, -h, 127.0.0.1]
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              # inclui os dados, que ficam em memória (volume `dados`)
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: dados
              mountPath: /var/lib/postgresql
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        # tmpfs: nada de I/O em disco no runner
        - name: dados
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grocery-ops-postgres
spec:
  selector:
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
