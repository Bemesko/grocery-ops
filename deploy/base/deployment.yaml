apiVersion: apps/v1
kind: Deployment
metadata:
  name: grocery-ops
spec:
  replicas: 1
  selector:
    matchLabels: {}
  template:
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # usuário `node` da imagem node:*-alpine (USER node no Dockerfile)
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Resolvido por `images:` na kustomization (digest gravado pelo release).
          image: app-image
          ports:
            - name: http
              containerPort: 8080
          env:
            # Contrato com o overlay (veja kustomization.yaml). O pod espera o secret existir.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: grocery-ops-db
                  key: DATABASE_URL
            - name: OTEL_SERVICE_NAME
              value: grocery-ops
          # Destino e ajustes da telemetria (OTEL_*), definidos pelo overlay. Sem o
          # ConfigMap, o app sobe com a telemetria desligada.
          envFrom:
            - configMapRef:
                name: grocery-ops-otel
                optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # pid e arquivos temporários do nginx (raiz somente leitura)
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
