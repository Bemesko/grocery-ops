# Sincronizado pelo ArgoCD do repo central (bernats-homelab/2026-kubernetes), na tag
# fixada em kubernetes/apps/values.yaml. Sem `namespace:`: ele vem do destination da
# Application. `base` é o app sem infraestrutura: sem Ingress, sem banco e sem destino de
# telemetria. Contratos que os overlays cumprem:
#   - Secret `grocery-ops-db`, chave DATABASE_URL (URL de um Postgres qualquer); um
#     componente pode apontar para outro secret (components/postgres-cnpg). Sem ele, a
#     base ainda sobe Healthy (o e2e do repo central usa a base pura), com a API em 503;
#   - ConfigMap `grocery-ops-otel` (opcional) com variáveis OTEL_* (OTEL_EXPORTER_OTLP_ENDPOINT
#     liga a telemetria).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: grocery-ops
    includeSelectors: true
resources:
  - deployment.yaml
  - service.yaml
# Segredos com KSOPS: veja o README ("Segredos").
# generators:
#   - secret-generator.yaml
# Gerenciado por scripts/set-image.sh (workflow release.yaml): sempre por digest.
# `unreleased` só existe até o primeiro release; nenhuma tag aponta para ele.
# Mantenha este bloco no fim do arquivo.
images:
  - name: app-image
    newName: ghcr.io/bemesko/grocery-ops
    digest: sha256:d482a85a352a14fca3af5621e78efb177797d6f5aaafaf5751f7a793705a8770
