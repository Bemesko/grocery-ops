version: 2
updates:
  # Imagem base do Dockerfile (o digest é atualizado junto com a tag)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      nuxt:
        patterns: ["nuxt", "vue", "@vite-pwa/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
